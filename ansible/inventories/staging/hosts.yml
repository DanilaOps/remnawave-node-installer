---
# A new node is two lines: how to reach it, and how it should be labelled for
# users. The inventory hostname carries the identity - "ee01" yields node_id
# ee_01, node_name EE-01, country EE and the domain ee01.<node_domain_zone>.
all:
  children:
    remnawave_nodes:
      hosts:
        ee01:
          ansible_host: 203.0.113.10
          node_host_remark: Estonia
          # Overrides, only when a node does not follow the pattern:
          # selfsteal_domain: node-ee-01.example.com
          # node_id: ee_01
          # node_name: EE-01
