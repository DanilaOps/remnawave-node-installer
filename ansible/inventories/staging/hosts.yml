---
# Reference inventory with documentation values only. A node is one line: the
# inventory hostname carries the identity ("ee01" -> node_id ee_01, node_name
# EE-01, country EE, domain ee01.<node_domain_zone>, label from the country
# table), and ansible_host says how to reach it.
all:
  children:
    remnawave_nodes:
      hosts:
        ee01:
          ansible_host: 203.0.113.10
          # Overrides, only when a node does not follow the pattern:
          # node_host_remark: "Estonia (Tallinn)"
          # selfsteal_domain: node-ee-01.example.com
          # node_id: ee_01
          # node_name: EE-01
