---
# A new node needs three facts: how to reach it, its identity and its domain.
# Everything else is derived in group_vars/remnawave_nodes.yml.
all:
  children:
    remnawave_nodes:
      hosts:
        ee01:
          ansible_host: 203.0.113.10
          node_id: ee_01
          # Optional metadata, and overrides for anything the derivation gets wrong:
          # provider: manual
          # region: ee
          # selfsteal_domain: ee01.example.com
          # node_host_remark: "Estonia"
