---
# Proves that a two-line host block is enough: everything else is derived.
# Runs against the staging inventory with connection: local, so it needs no
# server and no secrets.
- name: Verify what a two-line inventory host expands to
  hosts: remnawave_nodes
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: Show the derived values
      ansible.builtin.debug:
        msg:
          - "node_id          = {{ node_id }}"
          - "node_name        = {{ node_name }}"
          - "node_country     = {{ node_country }}"
          - "node_public_ip   = {{ node_public_ip }}"
          - "selfsteal_domain = {{ selfsteal_domain }}"
          - "inbound tag      = {{ inbound_specs[0].tag }}"
          - "host remark      = {{ host_specs[0].remark }}"
          - "host tags        = {{ host_specs[0].tags }}"
          - "decoy seed       = {{ selfsteal_decoy_seed | default(node_id) }}"

    - name: Require the derivation to hold
      ansible.builtin.assert:
        that:
          - node_id == 'ee_01'
          - node_name == 'EE-01'
          - node_country == 'EE'
          - node_public_ip == ansible_host
          - selfsteal_domain == 'ee01.' ~ node_domain_zone
          - inbound_specs[0].tag == 'EE_01_REALITY'
          - inbound_specs[0].port == 443
          - host_specs[0].remark == node_host_remark
          - host_specs[0].address == selfsteal_domain
          - host_specs[0].sni == selfsteal_domain
          - host_specs[0].inbound_tag == inbound_specs[0].tag
          - host_specs[0].tags == ['EE', 'DIRECT']
          - host_specs[0].tags | select('match', '^[A-Z0-9_:]+$') | list | length == 2
        success_msg: Two lines of inventory expand to a complete node definition.

    - name: Require the managed account and certificate policy to come from defaults
      ansible.builtin.assert:
        that:
          - ansible_user == 'deployer'
          - certificate_mode == 'http01'
          - certificate_acme_environment == 'auto'
          - config_profile_mode == 'shared'
          - dns_provider is defined
        success_msg: Fleet-wide policy needs no per-node variables.
