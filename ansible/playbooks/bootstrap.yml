---
# Turns a freshly created VPS into a host this project can manage:
# trust its SSH host key, create the managed account with the controller's key
# and password-less sudo, then prove that account can log in and escalate.
# Run once per node, before install_node.yml.

- name: Detect whether the managed account already works
  hosts: remnawave_nodes
  gather_facts: false
  become: false
  ignore_unreachable: true

  tasks:
    - name: Probe the managed account
      ansible.builtin.raw: /bin/true
      register: bootstrap_probe
      changed_when: false
      failed_when: false

    - name: Decide whether bootstrap has to run
      # Delegated to the controller so an unreachable node can still be given a
      # fact: this play is exactly the case where the node cannot be logged into.
      ansible.builtin.set_fact:
        bootstrap_required: "{{ bootstrap_probe.unreachable | default(false) | bool }}"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Report the decision
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ 'bootstrap required' if bootstrap_required else
             'already reachable as ' ~ (ansible_user | default('the inventory user')) ~
             ', skipping bootstrap' }}
      delegate_to: localhost

- name: Trust the SSH host key of a new node
  hosts: remnawave_nodes
  connection: local
  gather_facts: false
  become: false
  vars:
    # This play runs on the controller, so say which Python it uses instead of
    # letting interpreter discovery work it out. Discovery caches its answer on
    # the inventory host for the whole run, and the answer here is the
    # controller's interpreter - which the next play would then try to execute
    # on the node over SSH.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  tasks:
    - name: Refuse to trust a host key that nobody verified
      ansible.builtin.assert:
        that:
          - bootstrap_trust_new_host_keys | default(false) | bool
        fail_msg: >-
          {{ inventory_hostname }} has no entry in known_hosts. Either add its fingerprint
          from the provider console with ssh-keyscan, or set
          bootstrap_trust_new_host_keys=true to accept the key presented on first contact
          (trust on first use - acceptable on a freshly created VPS, not on an existing one).
      when: bootstrap_required | default(true) | bool

    - name: Read the host key presented by the node
      ansible.builtin.command:
        argv:
          - ssh-keyscan
          - -T
          - "10"
          - -p
          - "{{ ansible_port | default(22) }}"
          - "{{ ansible_host | default(inventory_hostname) }}"
      register: bootstrap_host_key
      changed_when: false
      failed_when: bootstrap_host_key.stdout | length == 0
      when: bootstrap_required | default(true) | bool

    - name: Store the host key for later runs
      ansible.builtin.known_hosts:
        name: >-
          {{ ('[' ~ (ansible_host | default(inventory_hostname)) ~ ']:' ~ ansible_port)
             if ansible_port | default(22) | int != 22
             else ansible_host | default(inventory_hostname) }}
        key: "{{ item }}"
        path: "{{ bootstrap_known_hosts_path | default(omit) }}"
        state: present
      loop: "{{ bootstrap_host_key.stdout_lines | default([]) | reject('match', '^#') | list }}"
      loop_control:
        label: "{{ item.split(' ')[1] | default('key') }}"
      when: bootstrap_required | default(true) | bool

- name: Create the managed account on a fresh VPS
  hosts: remnawave_nodes
  gather_facts: false
  any_errors_fatal: true
  # When this play carries a password, its task output is suppressed as a whole:
  # a single task without no_log is enough to leak the credential into a log that
  # Semaphore stores. The key-only path keeps normal output, so the common case
  # stays debuggable.
  no_log: "{{ bootstrap_ssh_password | default('') | trim | length > 0 }}"
  vars:
    ansible_user: "{{ bootstrap_ssh_user | default('root') }}"
    ansible_password: >-
      {{ bootstrap_ssh_password | trim
         if bootstrap_ssh_password | default('') | trim | length > 0
         else omit }}
    ansible_ssh_private_key_file: "{{ bootstrap_ssh_private_key_file | default(omit) }}"
    ansible_become: false

  pre_tasks:
    - name: Refuse to run with a password at raised verbosity
      # -vv and above print task arguments and connection details. Semaphore
      # passes the password as --extra-vars on the command line, so a verbose run
      # is the one way this credential reaches stored output.
      ansible.builtin.assert:
        that:
          - ansible_verbosity | int <= 1
        fail_msg: >-
          This run carries a root password and was started with -vv or higher.
          Re-run without raised verbosity, or bootstrap with an SSH key instead.
      no_log: false
      when: bootstrap_ssh_password | default('') | trim | length > 0

  roles:
    - role: node_bootstrap
      tags: [bootstrap]
      when: bootstrap_required | default(true) | bool

- name: Verify the managed account can log in and escalate
  hosts: remnawave_nodes
  gather_facts: true
  become: true
  any_errors_fatal: true

  tasks:
    - name: Confirm privilege escalation works for the managed account
      ansible.builtin.command:
        argv: [id, -un]
      register: bootstrap_escalation_check
      changed_when: false

    - name: Require root privileges through the managed account
      ansible.builtin.assert:
        that:
          - bootstrap_escalation_check.stdout | trim == 'root'
          - ansible_user_id is defined
        fail_msg: >-
          Could not escalate to root as {{ ansible_user | default('the inventory user') }};
          install_node.yml would fail at its first privileged task.

    - name: Report readiness
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is ready for playbooks/install_node.yml"
