---
node_base_supported_os:
  Debian: ["12", "13"]
  Ubuntu: ["24.04"]
node_base_supported_architectures: [x86_64, aarch64]
node_base_minimum_free_mb: 2048
node_base_hostname: "{{ node_name | lower }}"
node_base_timezone: UTC
node_base_upgrade_packages: true
node_base_reboot_if_required: true
node_base_packages:
  - ca-certificates
  - certbot
  - curl
  - fail2ban
  - gnupg
  - iproute2
  - jq
  - nftables
  - openssl
  - python3
  - python3-apt
  - python3-docker
  - unzip
  - unattended-upgrades

docker_apt_channel: stable
docker_package_version: ""
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_daemon_options:
  log-driver: json-file
  log-opts:
    max-size: 20m
    max-file: "5"
  live-restore: true
  userland-proxy: false

node_firewall_enabled: true
node_firewall_table: remnawave_filter
node_firewall_config_path: /etc/nftables.d/remnawave-filter.nft
node_firewall_rollback_seconds: 120
management_cidrs: []
remnawave_panel_cidrs: []
node_public_tcp_ports: [80, 443]
node_public_udp_ports: []
bridge_spec:
  enabled: false
node_role: direct

node_hardening_enabled: true
node_ssh_allow_root_password: false
node_fail2ban_enabled: true
node_disable_unused_protocols: true
node_sysctl:
  net.ipv4.tcp_rfc1337: 1
  net.ipv4.tcp_syncookies: 1
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.ip_forward: 1
  net.ipv6.conf.all.forwarding: 1
  net.core.default_qdisc: fq
  net.ipv4.tcp_congestion_control: bbr

remnawave_panel_validate_certs: true
remnawave_api_timeout: 60
preflight_check_dns: true
preflight_check_panel: true
preflight_check_ports: true
preflight_require_ntp_sync: false
