---
- name: Apply supported kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/90-remnawave.conf
    reload: true
  loop: "{{ node_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Disable unused network protocols
  ansible.builtin.copy:
    content: |
      install dccp /bin/false
      install sctp /bin/false
      install rds /bin/false
      install tipc /bin/false
    dest: /etc/modprobe.d/90-remnawave-disabled-protocols.conf
    owner: root
    group: root
    mode: "0644"
  when: node_disable_unused_protocols | bool

- name: Configure fail2ban for SSH
  ansible.builtin.template:
    src: fail2ban-sshd.local.j2
    dest: /etc/fail2ban/jail.d/remnawave-sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban
  when: node_fail2ban_enabled | bool

- name: Enable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
  when: node_fail2ban_enabled | bool

