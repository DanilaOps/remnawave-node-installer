---
# Controller-side preflight. Nothing here touches the node and nothing here
# changes anything anywhere: it runs entirely against the inventory and the panel
# API, before the DNS record is reconciled and before the first packet reaches
# the server. That is what makes the Semaphore "Preflight" template safe to press
# and what lets a node be validated before its VPS even exists.
- name: Validate the identity derived from the inventory
  ansible.builtin.assert:
    that:
      - node_id is match('^[a-z][a-z0-9]*_[a-z0-9-]+$')
      - node_name is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
      - node_country is match('^[A-Za-z]{2}$')
      - (node_public_ip | ansible.utils.ipaddr) != false
      - selfsteal_domain is match('^(?=.{1,253}$)([A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
      - remnawave_panel_url is match('^https://')
      - remnawave_node_port | int >= 1
      - remnawave_node_port | int <= 65535
      - remnawave_panel_cidrs | length > 0
      - internal_squad_uuid | default('') | length > 0 or internal_squad_name | default('') | length > 0
    fail_msg: >-
      Invalid or missing required variables. Identity is derived from the inventory hostname, which is
      expected to look like "ee01" (country code plus sequence) - name the host that way, or set node_id,
      node_name and node_country explicitly for this host. A panel CIDR and an Internal Squad identity
      are mandatory.

- name: Require a display name for this node's country
  ansible.builtin.assert:
    that:
      - node_host_remark | default('') | trim | length > 0
    fail_msg: >-
      Country code '{{ node_country | upper }}' (from inventory hostname '{{ inventory_hostname }}')
      has no entry in ansible/playbooks/group_vars/all/countries.yml. Add one line there -
      '"{{ node_country | upper }}": "<flag> <Country>"' - or set node_host_remark on this host if it
      needs a label of its own. Publishing a Host with an empty label would show users a blank entry.

- name: Validate every statically configured CIDR
  ansible.builtin.assert:
    that:
      - (item | ansible.utils.ipaddr) != false
    fail_msg: "Invalid CIDR in configuration: {{ item }}"
  loop: "{{ (management_cidrs | default([])) + (management_cidrs_extra | default([])) + remnawave_panel_cidrs }}"
  loop_control:
    label: "{{ item }}"

- name: Validate bridge input
  ansible.builtin.assert:
    that:
      - bridge_spec.entry_address | default('') | length > 0
      - bridge_spec.port | default(0) | int >= 1
      - bridge_spec.port | default(0) | int <= 65535
      - bridge_spec.method | default('') | length > 0
      - bridge_spec.user | default('') is match('^[A-Za-z0-9_-]{3,36}$')
    fail_msg: bridge_spec must define entry_address, port, method and a valid service user.
  when: bridge_spec.enabled | default(false) | bool

# --- Panel state -------------------------------------------------------------
- name: Verify panel connectivity and token scope
  ansible.builtin.uri:
    url: "{{ remnawave_panel_url | regex_replace('/+$', '') }}/api/nodes"
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_token }}"
    return_content: true
    status_code: 200
    timeout: "{{ remnawave_api_timeout }}"
    validate_certs: "{{ remnawave_panel_validate_certs }}"
  register: node_base_preflight_nodes
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false
  check_mode: false
  when: preflight_check_panel | bool

- name: Reject a conflicting Node in the panel
  ansible.builtin.assert:
    that:
      - node_base_preflight_node_by_name | length <= 1
      - node_base_preflight_node_by_address | length <= 1
      - >-
        node_base_preflight_node_by_name | length == 0 or
        node_base_preflight_node_by_address | length == 0 or
        node_base_preflight_node_by_name[0].uuid == node_base_preflight_node_by_address[0].uuid
    fail_msg: >-
      The panel already holds conflicting Nodes: {{ node_base_preflight_node_by_name | map(attribute='name') | list }}
      matches the name {{ node_name }} and
      {{ node_base_preflight_node_by_address | map(attribute='name') | list }} matches the address
      {{ node_public_ip }}. Resolve that in the panel first - this run would not know which one it owns.
  vars:
    node_base_preflight_node_by_name: >-
      {{ node_base_preflight_nodes.json.response | selectattr('name', 'equalto', node_name) | list }}
    node_base_preflight_node_by_address: >-
      {{ node_base_preflight_nodes.json.response | selectattr('address', 'equalto', node_public_ip) | list }}
  when: preflight_check_panel | bool

- name: Read the panel's Config Profiles
  ansible.builtin.uri:
    url: "{{ remnawave_panel_url | regex_replace('/+$', '') }}/api/config-profiles"
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_token }}"
    return_content: true
    status_code: 200
    timeout: "{{ remnawave_api_timeout }}"
    validate_certs: "{{ remnawave_panel_validate_certs }}"
  register: node_base_preflight_profiles
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false
  check_mode: false
  when: preflight_check_panel | bool

- name: Treat an empty Config Profile list as a panel problem, not as a fresh panel
  # A 200 with nothing in it is what a degraded panel or a token without the right
  # scope looks like. Continuing from here is how a second "Default August" gets
  # created next to the real one.
  ansible.builtin.assert:
    that:
      - node_base_preflight_profiles.json | remnawave_response_items('configProfiles') | length > 0
    fail_msg: >-
      The panel returned an empty Config Profile list. This deployment always has at least the shared
      profile '{{ profile_name }}', so an empty answer means a degraded panel or a token without the
      Config Profile scope. Refusing to continue rather than treating it as an empty panel.
  when: preflight_check_panel | bool

- name: Select the Config Profile this node will publish against
  ansible.builtin.set_fact:
    node_base_preflight_profile: >-
      {{ (node_base_preflight_profiles.json | remnawave_response_items('configProfiles') |
          selectattr('uuid', 'equalto', profile_uuid) | list)
         if profile_uuid | default('') | length > 0 else
         (node_base_preflight_profiles.json | remnawave_response_items('configProfiles') |
          selectattr('name', 'equalto', profile_name) | list) }}
    node_base_preflight_foreign_owners: >-
      {{ node_base_preflight_profiles.json | remnawave_response_items('configProfiles') |
         remnawave_inbound_owners(inbound_specs | map(attribute='tag') | list, '') }}
  when: preflight_check_panel | bool

- name: Require the shared Config Profile to exist before the node is touched
  ansible.builtin.assert:
    that:
      - node_base_preflight_profile | length == 1 or config_profile_create | default(false) | bool
    fail_msg: >-
      Config Profile '{{ profile_name }}' was not found in the panel
      ({{ node_base_preflight_profile | length }} matches). It is the Xray JSON that carries the routing
      every published Host depends on, so it is never created silently. Create it in the panel, fix
      profile_name, or set config_profile_create=true to bootstrap it from the role template.
  when:
    - preflight_check_panel | bool
    - config_profile_mode | default('shared') == 'shared'

- name: Reject an inbound tag that another Config Profile already owns
  ansible.builtin.assert:
    that:
      - >-
        node_base_preflight_foreign_owners | rejectattr('uuid', 'equalto',
          node_base_preflight_profile[0].uuid | default('')) | list | length == 0
    fail_msg: >-
      Inbound tag(s) {{ inbound_specs | map(attribute='tag') | list }} already exist in another Config
      Profile: {{ node_base_preflight_foreign_owners }}. Two profiles claiming one tag makes the published
      Host ambiguous; rename this node or remove the stale inbound.
  when: preflight_check_panel | bool

- name: Read the target Config Profile in full
  ansible.builtin.uri:
    url: >-
      {{ remnawave_panel_url | regex_replace('/+$', '') }}/api/config-profiles/{{
         node_base_preflight_profile[0].uuid }}
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_token }}"
    return_content: true
    status_code: 200
    timeout: "{{ remnawave_api_timeout }}"
    validate_certs: "{{ remnawave_panel_validate_certs }}"
  register: node_base_preflight_profile_detail
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false
  check_mode: false
  when:
    - preflight_check_panel | bool
    - node_base_preflight_profile | default([]) | length == 1

- name: Require the target Config Profile to carry routing rules
  ansible.builtin.assert:
    that:
      - node_base_preflight_profile_detail.json.response.config.routing.rules | default([]) | length > 0
    fail_msg: >-
      Config Profile '{{ profile_name }}' has no routing rules. Publishing a Host against it would ship
      clients a configuration without this deployment's routing.
  when:
    - preflight_check_panel | bool
    - config_profile_require_routing | default(true) | bool
    - node_base_preflight_profile_detail is not skipped | default(false)

- name: Require every inbound in the shared profile to be one the panel strips per node
  # The panel removes inbounds of managed protocols that a node does not activate
  # before it pushes the config. An inbound of any other protocol is delivered to
  # every node with its settings, so one is only allowed in the shared profile
  # when its tag is listed on purpose.
  ansible.builtin.assert:
    that:
      - >-
        node_base_preflight_profile_detail.json.response.config.inbounds | default([])
        | rejectattr('protocol', 'in', shared_profile_managed_protocols)
        | rejectattr('tag', 'in', shared_profile_allowed_unmanaged_inbound_tags | default([]))
        | list | length == 0
    fail_msg: >-
      Config Profile '{{ profile_name }}' carries inbound(s)
      {{ node_base_preflight_profile_detail.json.response.config.inbounds | default([])
         | rejectattr('protocol', 'in', shared_profile_managed_protocols)
         | rejectattr('tag', 'in', shared_profile_allowed_unmanaged_inbound_tags | default([]))
         | map(attribute='tag') | list }}
      whose protocol is not one the panel strips per node ({{ shared_profile_managed_protocols | join(', ') }}).
      Every node in the fleet receives such an inbound in full, settings included. If that is intended,
      list the tag in shared_profile_allowed_unmanaged_inbound_tags.
  when:
    - preflight_check_panel | bool
    - node_base_preflight_profile_detail is not skipped | default(false)

- name: Read the panel's Hosts for a conflict check
  ansible.builtin.uri:
    url: "{{ remnawave_panel_url | regex_replace('/+$', '') }}/api/hosts"
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_token }}"
    return_content: true
    status_code: 200
    timeout: "{{ remnawave_api_timeout }}"
    validate_certs: "{{ remnawave_panel_validate_certs }}"
  register: node_base_preflight_hosts
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false
  check_mode: false
  when: preflight_check_panel | bool

- name: Reject ambiguous Hosts in the panel
  ansible.builtin.assert:
    that:
      - >-
        node_base_preflight_hosts.json.response |
        selectattr('remark', 'equalto', item.remark) |
        selectattr('address', 'equalto', item.address) | list | length <= 1
    fail_msg: >-
      The panel already holds more than one Host called '{{ item.remark }}' at {{ item.address }};
      this run would not know which one it owns.
  loop: "{{ host_specs }}"
  loop_control:
    label: "{{ item.remark }}"
  when: preflight_check_panel | bool

- name: Record that the panel was not checked
  ansible.builtin.assert:
    that:
      - preflight_ack_unchecked_panel | bool
    fail_msg: >-
      preflight_check_panel is false, which removes every check that protects the shared Config Profile
      and the panel from a conflicting node. Set preflight_ack_unchecked_panel=true to state that this
      is intentional for this run.
  when: not (preflight_check_panel | bool)

# --- DNS state, reported and never changed here -------------------------------
- name: Resolve the selfsteal name from the controller
  ansible.builtin.command:
    argv: [getent, ahostsv4, "{{ selfsteal_domain }}"]
  register: node_base_preflight_dns
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  check_mode: false
  when: preflight_check_dns | bool

- name: Report the DNS state this run will find
  ansible.builtin.debug:
    msg: >-
      {{ selfsteal_domain }}:
      {{ ('already resolves to ' ~ node_public_ip)
         if node_public_ip in node_base_preflight_dns_addresses
         else ((('resolves to ' ~ (node_base_preflight_dns_addresses | join(', ')))
                if node_base_preflight_dns_addresses | length > 0 else 'does not resolve') ~
               (' - the dns role will point it at ' ~ node_public_ip
                if dns_provider | default('none') != 'none'
                else ' - nothing in this run will fix that')) }}
  vars:
    node_base_preflight_dns_addresses: >-
      {{ node_base_preflight_dns.stdout | default('') | regex_findall('(?m)^([0-9.]+)\s+') | unique }}
  when: preflight_check_dns | bool

- name: Require an unmanaged DNS record to already be correct
  ansible.builtin.assert:
    that:
      - node_public_ip in (node_base_preflight_dns.stdout | default('') | regex_findall('(?m)^([0-9.]+)\s+'))
    fail_msg: >-
      {{ selfsteal_domain }} does not resolve to {{ node_public_ip }} and dns_provider is 'none', so
      nothing in this run will create the record. Create the A record at the registrar (or set
      dns_provider) and run again - the certificate and the masking site both depend on it.
  when:
    - preflight_check_dns | bool
    - dns_provider | default('none') == 'none'
