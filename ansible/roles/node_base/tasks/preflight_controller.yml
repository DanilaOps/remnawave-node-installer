---
# Controller-side preflight. Nothing here touches the node and nothing here
# changes anything anywhere: it runs entirely against the inventory and the panel
# API, before the DNS record is reconciled and before the first packet reaches
# the server. That is what makes the Semaphore "Preflight" template safe to press
# and what lets a node be validated before its VPS even exists.
- name: Validate the identity derived from the inventory
  ansible.builtin.assert:
    that:
      - node_id is match('^[a-z][a-z0-9]*_[a-z0-9-]+$')
      - node_name is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
      - node_country is match('^[A-Za-z]{2}$')
      - (node_public_ip | ansible.utils.ipaddr) != false
      - selfsteal_domain is match('^(?=.{1,253}$)([A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$')
      - remnawave_panel_url is match('^https://')
      - remnawave_node_port | int >= 1
      - remnawave_node_port | int <= 65535
      - remnawave_panel_cidrs | length > 0
      - internal_squad_uuid | default('') | length > 0 or internal_squad_name | default('') | length > 0
    fail_msg: >-
      Invalid or missing required variables. Identity is derived from the inventory hostname, which is
      expected to look like "ee01" (country code plus sequence) - name the host that way, or set node_id,
      node_name and node_country explicitly for this host. A panel CIDR and an Internal Squad identity
      are mandatory.

- name: Require the node name to follow the fleet's naming
  # <CC>-NN, so the next node of a country can be allocated by looking at the
  # ones that exist. A name outside the pattern is not a style problem: nothing
  # can compute what comes after it.
  ansible.builtin.assert:
    that:
      - node_name is match(node_name_pattern | default('^[A-Z]{2}-[0-9]{2,}$'))
    fail_msg: >-
      Node name '{{ node_name }}' does not match {{ node_name_pattern | default('^[A-Z]{2}-[0-9]{2,}$') }}.
      It is derived from the inventory hostname, which is expected to read like 'tr01' - two-letter
      country code plus a zero-padded ordinal. Rename the inventory host, or set node_name_pattern
      for a fleet that names its nodes differently.

- name: Report the identity this run reconciles
  # Printed before the first change, so the operator sees what the inventory
  # hostname expanded into and can stop the run if it is not what was meant.
  # Every value is read with a default: this is a report, and a missing variable
  # is the business of the assertions above, not of the line that prints it.
  ansible.builtin.debug:
    msg:
      - "inventory host      = {{ inventory_hostname }}   (the only place this number is written)"
      - "country             = {{ node_country | default('?') }}"
      - "node identity       = {{ node_name | default('?') }}   (derived, not allocated at run time)"
      - >-
        config profile      = {{ profile_name | default('') | default('(not set)', true) }}
        (Xray JSON this node runs)
      - >-
        xray json template  =
        {{ xray_json_template_name | default('') | default('(not managed)', true) }}
        (Xray JSON a client receives)
      - >-
        internal squad      =
        {{ internal_squad_name | default('') | default('(by uuid)', true) }}
      - "dns hostname        = {{ selfsteal_domain | default('?') }}"
      - "address             = {{ node_public_ip | default('?') }}"

- name: Require a panel token before anything asks the panel for something
  # Without this the first API call fails with an opaque 401 inside a no_log
  # task, which is the least helpful way to learn that the secrets file was not
  # loaded.
  ansible.builtin.assert:
    that:
      - remnawave_panel_token | default('') | trim | length > 0
    fail_msg: >-
      remnawave_panel_token is empty. It comes from vault_remnawave_panel_token in
      /etc/remnawave/secrets.yml, which every Semaphore template loads as
      '-e' '@/etc/remnawave/secrets.yml' and ./provision-node loads automatically. Check that the
      file exists, that it is decryptable with the vault password, and that the template's arguments
      still name it.
  no_log: true

- name: Refuse to run against the published documentation values
  # Everything tracked in this public repository carries example values. A run
  # that still sees them did not get its deployment values: on the command line
  # /etc/remnawave/fleet.yml is missing, and from Semaphore the template lost the
  # '-e @/etc/remnawave/fleet.yml' argument. Failing here is the point - the
  # alternative is a node published against a panel that does not exist.
  ansible.builtin.assert:
    that:
      - remnawave_panel_url != 'https://panel.example.com'
      - node_domain_zone != 'example.com'
      - acme_email != 'ops@example.com'
    fail_msg: >-
      This run is still using the documentation values from the repository
      (panel {{ remnawave_panel_url }}, zone {{ node_domain_zone }}). The real values live in
      /etc/remnawave/fleet.yml on the controller and are loaded as an extra-vars file. On the
      command line ./provision-node adds it automatically when it exists; from Semaphore the
      template's arguments must contain '-e' '@/etc/remnawave/fleet.yml'. Copy
      ansible/examples/fleet.yml.example there and fill it in.

- name: Refuse a node identity that did not come from its inventory hostname
  # Extra vars outrank every file and every host, so a node_id, selfsteal_domain
  # or ansible_host set globally - in a Semaphore Variable Group, for instance -
  # would give every node in the fleet the identity of one node, and each run
  # would overwrite the previous node's panel objects. The identity is therefore
  # recomputed from the inventory hostname here and compared with what the run
  # actually resolved.
  vars:
    node_base_expected_country: "{{ inventory_hostname | regex_replace('^([A-Za-z]+).*$', '\\1') | upper }}"
    node_base_expected_sequence: "{{ inventory_hostname | regex_replace('^[A-Za-z]+[-_]?', '') }}"
  ansible.builtin.assert:
    that:
      - node_id == (node_base_expected_country | lower) ~ '_' ~ node_base_expected_sequence
      - node_name == node_base_expected_country ~ '-' ~ node_base_expected_sequence
      - node_country | upper == node_base_expected_country
      - node_public_ip == ansible_host
      - selfsteal_domain == inventory_hostname ~ '.' ~ node_domain_zone
    fail_msg: >-
      The identity this run resolved does not match the inventory hostname '{{ inventory_hostname }}'.
      Expected node_id {{ (node_base_expected_country | lower) ~ '_' ~ node_base_expected_sequence }},
      node_name {{ node_base_expected_country ~ '-' ~ node_base_expected_sequence }} and
      {{ inventory_hostname ~ '.' ~ node_domain_zone }}; got {{ node_id }}, {{ node_name }} and
      {{ selfsteal_domain }} at {{ node_public_ip }} (ansible_host is {{ ansible_host }}).
      A node identity supplied globally - a Variable Group, a stray -e - applies to every host at
      once and makes each run overwrite the previous node's panel objects. Put per-node values in
      the inventory host block, and set node_identity_override_ack=true on that host if it really
      does need an identity of its own.
  when: not (node_identity_override_ack | default(false) | bool)

- name: Require a display name for this node's country
  ansible.builtin.assert:
    that:
      - node_host_remark | default('') | trim | length > 0
    fail_msg: >-
      Country code '{{ node_country | upper }}' (from inventory hostname '{{ inventory_hostname }}')
      has no entry in ansible/playbooks/group_vars/all/countries.yml. Add one line there -
      '"{{ node_country | upper }}": "<flag> <Country>"' - or set node_host_remark on this host if it
      needs a label of its own. Publishing a Host with an empty label would show users a blank entry.

- name: Validate every statically configured CIDR
  ansible.builtin.assert:
    that:
      - (item | ansible.utils.ipaddr) != false
    fail_msg: "Invalid CIDR in configuration: {{ item }}"
  loop: "{{ (management_cidrs | default([])) + (management_cidrs_extra | default([])) + remnawave_panel_cidrs }}"
  loop_control:
    label: "{{ item }}"

- name: Refuse a documentation address as the operator's permanent SSH access
  # management_cidrs_extra is the one place a human types their own public
  # address, and it is the difference between "I can still log in directly" and
  # "only the controller can reach this node". Copied straight from
  # examples/fleet.yml.example it holds an RFC 5737 documentation address, which
  # is never routed - so the rule is written, the firewall looks configured, and
  # the operator finds out it is not the first time they need it. Refused here,
  # controller-side, before the VPS is touched.
  ansible.builtin.assert:
    that:
      # Containment, not string equality: the trap is any address out of those
      # three blocks, whatever prefix somebody wrote it with.
      - >-
        not ((item | ansible.utils.ipaddr('network'))
             | remnawave_ip_in_cidrs(['192.0.2.0/24', '198.51.100.0/24',
                                      '203.0.113.0/24', '2001:db8::/32']))
    fail_msg: >-
      management_cidrs_extra contains {{ item }}, which is in a range reserved for documentation
      (RFC 5737 / RFC 3849) and is never routed on the internet. That is the value shipped in
      ansible/examples/fleet.yml.example. Put your own public address in
      /etc/remnawave/fleet.yml as management_cidrs_extra, or remove the entry.
  loop: "{{ management_cidrs_extra | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: Report that only the controller will keep direct SSH access
  # Not a failure: a fleet that is only ever administered through Semaphore is a
  # legitimate choice. But it has to be a choice somebody made and can see,
  # because the firewall this run installs has a default-drop input chain.
  ansible.builtin.debug:
    msg: >-
      management_cidrs_extra is empty, so after this run TCP/{{ ansible_port | default(22) }} on
      {{ inventory_hostname }} will be reachable from the controller only - the address sshd sees
      for this very connection. To keep direct access from your own machine, add it to
      /etc/remnawave/fleet.yml as "management_cidrs_extra: ['<your public IP>/32']" and re-run
      template 02. See ansible/README.md, "Keeping your own SSH access".
  when: management_cidrs_extra | default([]) | length == 0

- name: Report who will keep direct SSH access
  ansible.builtin.debug:
    msg: >-
      TCP/{{ ansible_port | default(22) }} on {{ inventory_hostname }} will be reachable from the
      controller (discovered from this connection) and from
      {{ management_cidrs_extra | join(', ') }}. Nothing else: the input chain drops by default.
  when: management_cidrs_extra | default([]) | length > 0

- name: Validate node-side monitoring
  # Controller-side, so an exporter that would be published to the internet is
  # refused before the VPS is touched. The exporter has no authentication, so
  # its port belongs in a source-restricted rule and never in the public set.
  ansible.builtin.assert:
    that:
      - (node_monitoring_exporter_port | int) not in (node_public_tcp_ports | default([]) | map('int') | list)
      - (node_monitoring_exporter_port | int) not in (node_public_udp_ports | default([]) | map('int') | list)
      - not (node_monitoring_enabled | bool) or (monitoring_scrape_cidrs | length > 0)
    fail_msg: >-
      Monitoring is configured in a way that would publish it. Port
      {{ node_monitoring_exporter_port }} must not appear in node_public_tcp_ports or
      node_public_udp_ports, and node_monitoring_enabled needs at least one address in
      monitoring_scrape_cidrs - node_exporter authenticates nobody.

- name: Validate every monitoring scrape CIDR
  ansible.builtin.assert:
    that:
      - (item | ansible.utils.ipaddr) != false
      - (item | ansible.utils.ipaddr('prefix') | int) > 0
    fail_msg: >-
      monitoring_scrape_cidrs contains {{ item }}, which is not a host or subnet that names the
      monitoring host.
  loop: "{{ monitoring_scrape_cidrs | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: Validate the capacity a node declares in the inventory
  # Caught here, controller-side, so a quoted or negative figure fails before the
  # node is touched rather than being refused later by the capacity sync. A bare
  # number only: "1000", never "1000" in quotes, which compares wrong the same
  # way the capacity file refuses it.
  ansible.builtin.assert:
    that:
      - capacity_download_mbps is not defined or (capacity_download_mbps is number and capacity_download_mbps >= 0)
      - capacity_upload_mbps is not defined or (capacity_upload_mbps is number and capacity_upload_mbps >= 0)
      - capacity_certain is not defined or (capacity_certain | string | lower) in ['true', 'false']
    fail_msg: >-
      Capacity on {{ inventory_hostname }} is malformed. capacity_download_mbps and
      capacity_upload_mbps must be bare non-negative numbers (1000, not "1000"), and
      capacity_certain must be true or false. See group_vars/remnawave_nodes/capacity.yml.

- name: Refuse manual and auto capacity on the same node
  # Two sources of truth for one figure is ambiguous, so it is refused rather
  # than resolved by guessing which wins. capacity_auto_test measures it;
  # capacity_download_mbps/upload_mbps state it by hand. Not both.
  ansible.builtin.assert:
    that:
      - >-
        not (capacity_auto_test | default(false) | bool)
        or (capacity_download_mbps is not defined and capacity_upload_mbps is not defined)
    fail_msg: >-
      {{ inventory_hostname }} sets capacity_auto_test together with a manual capacity figure.
      Choose one: capacity_auto_test to measure the rating, or capacity_download_mbps and
      capacity_upload_mbps with capacity_certain to state it by hand.

- name: Refuse an auto-tested node in an aggregate pool before iperf runs
  # Fail early, before any traffic: an auto rating is a per-node figure, and a
  # pool rated as one whole location cannot hold one. Reuses the sync tool's own
  # check with a synthetic rating so the rule is defined in exactly one place.
  when: capacity_auto_test | default(false) | bool
  block:
    - name: Probe the target pool with a synthetic per-node rating
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../../monitoring/sync_capacity.py"
          - --base
          - "{{ playbook_dir }}/../../monitoring/capacity/capacity.yml"
          - --inventory-json
          - "-"
          - --check
        stdin: >-
          {{ [{'name': node_name, 'pool': node_capacity_pool,
               'download_mbps': 1, 'upload_mbps': 1, 'certain': true}] | to_json }}
      register: capacity_pool_probe
      changed_when: false
      failed_when: false

    - name: Stop before testing a node its pool cannot rate
      ansible.builtin.assert:
        that:
          - capacity_pool_probe.rc == 0
        fail_msg: >-
          {{ node_name }} is set to auto-measure its capacity, but pool {{ node_capacity_pool }}
          cannot take a per-node rating: {{ capacity_pool_probe.stderr | trim }}
          Set capacity_pool to a per-node pool, keep this node unrated inside the aggregate
          pool, or migrate the pool separately - the auto-test will not run until this is
          resolved.

- name: Report that a declared node cannot share an aggregate pool
  # The one capacity mistake the sync tool would otherwise catch only at the end:
  # a node that rates itself in a pool the base rates as one location. Surfaced
  # here as a warning with the fix, so the operator sees it before the run.
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} declares its own capacity and belongs to pool
      {{ node_capacity_pool }}. If that pool is rated as one location in
      monitoring/capacity/capacity.yml, the capacity sync will refuse it - put the node in a
      per-node pool with capacity_pool instead. A pool cannot be a location total and hold a
      member that rates itself; the same capacity would be counted twice.
  when:
    - capacity_certain | default(false) | bool
    - capacity_download_mbps is defined or capacity_upload_mbps is defined

- name: Validate bridge input
  ansible.builtin.assert:
    that:
      - bridge_spec.entry_address | default('') | length > 0
      - bridge_spec.port | default(0) | int >= 1
      - bridge_spec.port | default(0) | int <= 65535
      - bridge_spec.method | default('') | length > 0
      - bridge_spec.user | default('') is match('^[A-Za-z0-9_-]{3,36}$')
    fail_msg: bridge_spec must define entry_address, port, method and a valid service user.
  when: bridge_spec.enabled | default(false) | bool

# --- Panel state -------------------------------------------------------------
- name: Verify panel connectivity and token scope
  ansible.builtin.uri:
    url: "{{ remnawave_panel_url | regex_replace('/+$', '') }}/api/nodes"
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_token }}"
    return_content: true
    status_code: 200
    timeout: "{{ remnawave_api_timeout }}"
    validate_certs: "{{ remnawave_panel_validate_certs }}"
  register: node_base_preflight_nodes
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false
  check_mode: false
  when: preflight_check_panel | bool

- name: Reject a conflicting Node in the panel
  ansible.builtin.assert:
    that:
      - node_base_preflight_node_by_name | length <= 1
      - node_base_preflight_node_by_address | length <= 1
      - >-
        node_base_preflight_node_by_name | length == 0 or
        node_base_preflight_node_by_address | length == 0 or
        node_base_preflight_node_by_name[0].uuid == node_base_preflight_node_by_address[0].uuid
    fail_msg: >-
      The panel already holds conflicting Nodes: {{ node_base_preflight_node_by_name | map(attribute='name') | list }}
      matches the name {{ node_name }} and
      {{ node_base_preflight_node_by_address | map(attribute='name') | list }} matches the address
      {{ node_public_ip }}. Resolve that in the panel first - this run would not know which one it owns.
  vars:
    node_base_preflight_node_by_name: >-
      {{ node_base_preflight_nodes.json.response | selectattr('name', 'equalto', node_name) | list }}
    node_base_preflight_node_by_address: >-
      {{ node_base_preflight_nodes.json.response | selectattr('address', 'equalto', node_public_ip) | list }}
  when: preflight_check_panel | bool

- name: Read the panel's Config Profiles
  ansible.builtin.uri:
    url: "{{ remnawave_panel_url | regex_replace('/+$', '') }}/api/config-profiles"
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_token }}"
    return_content: true
    status_code: 200
    timeout: "{{ remnawave_api_timeout }}"
    validate_certs: "{{ remnawave_panel_validate_certs }}"
  register: node_base_preflight_profiles
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false
  check_mode: false
  when: preflight_check_panel | bool

- name: Treat an empty Config Profile list as a panel problem, not as a fresh panel
  # A 200 with nothing in it is what a degraded panel or a token without the right
  # scope looks like. Continuing from here is how a second Config Profile gets
  # created next to the real one.
  ansible.builtin.assert:
    that:
      - node_base_preflight_profiles.json | remnawave_response_items('configProfiles') | length > 0
    fail_msg: >-
      The panel returned an empty Config Profile list. This deployment always holds at least one
      Config Profile, so an empty answer means a degraded panel or a token without the Config
      Profile scope. Refusing to continue rather than treating it as an empty panel.
  when: preflight_check_panel | bool

- name: Select the Config Profile this node will publish against
  ansible.builtin.set_fact:
    node_base_preflight_profile: >-
      {{ (node_base_preflight_profiles.json | remnawave_response_items('configProfiles') |
          selectattr('uuid', 'equalto', profile_uuid) | list)
         if profile_uuid | default('') | length > 0 else
         (node_base_preflight_profiles.json | remnawave_response_items('configProfiles') |
          selectattr('name', 'equalto', profile_name) | list) }}
    node_base_preflight_foreign_owners: >-
      {{ node_base_preflight_profiles.json | remnawave_response_items('configProfiles') |
         remnawave_inbound_owners(inbound_specs | map(attribute='tag') | list, '') }}
  when: preflight_check_panel | bool

- name: Require the shared Config Profile to exist before the node is touched
  ansible.builtin.assert:
    that:
      - node_base_preflight_profile | length == 1 or config_profile_create | default(false) | bool
    fail_msg: >-
      Config Profile '{{ profile_name }}' is absent from the panel
      ({{ node_base_preflight_profile | length }} matches). A Config Profile is the Xray JSON the
      node itself runs (/api/config-profiles); it is not the client-side Xray JSON template
      (xray_json_template_name, /api/subscription-templates) and not an Internal Squad. It carries
      the routing every published Host depends on, so it is never created silently. Create it in the
      panel, fix profile_name, or set config_profile_create=true to bootstrap it from the role
      template. The Config Profiles this panel holds are:
      {{ node_base_preflight_profiles.json | remnawave_response_items('configProfiles') |
         map(attribute='name') | list | join(', ') | default('(none)', true) }}.
  when:
    - preflight_check_panel | bool
    - config_profile_mode | default('shared') == 'shared'

# The Xray JSON template is a third, separate entity: a Subscription Template of
# type XRAY_JSON that a Host carries through xrayJsonTemplateUuid. Checked here so
# a wrong name stops the run before the registrar and the server are touched, and
# so the message says "Xray JSON template", never "Config Profile".
- name: List the subscription templates the panel holds
  ansible.builtin.uri:
    url: "{{ remnawave_panel_url | regex_replace('/+$', '') }}/api/subscription-templates"
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_token }}"
    return_content: true
    status_code: 200
    timeout: "{{ remnawave_api_timeout }}"
    validate_certs: "{{ remnawave_panel_validate_certs }}"
  register: node_base_preflight_templates
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false
  check_mode: false
  when:
    - preflight_check_panel | bool
    - xray_json_template_name | default('') | length > 0

- name: Require the Xray JSON template to exist before the node is touched
  ansible.builtin.assert:
    that:
      - >-
        node_base_preflight_templates.json | remnawave_response_items('templates') |
        selectattr('templateType', 'equalto', 'XRAY_JSON') |
        selectattr('name', 'equalto', xray_json_template_name) | list | length == 1
    fail_msg: >-
      Xray JSON template '{{ xray_json_template_name }}' is absent or ambiguous. It is a
      Subscription Template of type XRAY_JSON (/api/subscription-templates) - the JSON a client
      receives - and it is a different object from the Config Profile '{{ profile_name }}' the node
      runs. The XRAY_JSON templates this panel holds are:
      {{ node_base_preflight_templates.json | remnawave_response_items('templates') |
         selectattr('templateType', 'equalto', 'XRAY_JSON') | map(attribute='name') | list |
         join(', ') | default('(none)', true) }}.
  when:
    - preflight_check_panel | bool
    - xray_json_template_name | default('') | length > 0

- name: Reject a Config Profile that carries this node's name but another node's traffic
  # The dangerous half of a name collision. A Config Profile named TR-01 with no
  # Node TR-01 is normally this project's own object from an interrupted run, and
  # reconciling it is right. A profile of that name holding inbounds that belong
  # to somebody else is not ours, and adopting it would publish this node against
  # a stranger's Xray JSON.
  ansible.builtin.assert:
    that:
      - >-
        node_base_preflight_profile_inbound_tags |
        reject('in', inbound_specs | map(attribute='tag') | list) | list | length == 0
    fail_msg: >-
      Config Profile '{{ profile_name }}' already exists and carries inbound(s)
      {{ node_base_preflight_profile_inbound_tags |
         reject('in', inbound_specs | map(attribute='tag') | list) | list | join(', ') }},
      which are not this node's ({{ inbound_specs | map(attribute='tag') | list | join(', ') }}).
      A per-node profile is named after its node, so this one belongs to something else. Reconciling
      it would publish {{ node_name }} against another node's Xray JSON. Rename this node, or set
      profile_name explicitly if the profile really is shared on purpose.
  vars:
    node_base_preflight_profile_inbound_tags: >-
      {{ (node_base_preflight_profile[0].inbounds | default([]) | selectattr('tag', 'defined') |
          map(attribute='tag') | list) if node_base_preflight_profile | length == 1 else [] }}
  when:
    - preflight_check_panel | bool
    - profile_name == node_name
    - node_base_preflight_profile | length == 1

- name: Reject an inbound tag that another Config Profile already owns
  ansible.builtin.assert:
    that:
      - >-
        node_base_preflight_foreign_owners | rejectattr('uuid', 'equalto',
          node_base_preflight_profile[0].uuid | default('')) | list | length == 0
    fail_msg: >-
      Inbound tag(s) {{ inbound_specs | map(attribute='tag') | list }} already exist in another Config
      Profile: {{ node_base_preflight_foreign_owners }}. Two profiles claiming one tag makes the published
      Host ambiguous; rename this node or remove the stale inbound.
  when: preflight_check_panel | bool

- name: Read the target Config Profile in full
  ansible.builtin.uri:
    url: >-
      {{ remnawave_panel_url | regex_replace('/+$', '') }}/api/config-profiles/{{
         node_base_preflight_profile[0].uuid }}
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_token }}"
    return_content: true
    status_code: 200
    timeout: "{{ remnawave_api_timeout }}"
    validate_certs: "{{ remnawave_panel_validate_certs }}"
  register: node_base_preflight_profile_detail
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false
  check_mode: false
  when:
    - preflight_check_panel | bool
    - node_base_preflight_profile | default([]) | length == 1

- name: Require the target Config Profile to carry routing rules
  ansible.builtin.assert:
    that:
      - node_base_preflight_profile_detail.json.response.config.routing.rules | default([]) | length > 0
    fail_msg: >-
      Config Profile '{{ profile_name }}' has no routing rules. Publishing a Host against it would ship
      clients a configuration without this deployment's routing.
  when:
    - preflight_check_panel | bool
    - config_profile_require_routing | default(true) | bool
    - node_base_preflight_profile_detail is not skipped | default(false)

- name: Require every inbound in the shared profile to be one the panel strips per node
  # The panel removes inbounds of managed protocols that a node does not activate
  # before it pushes the config. An inbound of any other protocol is delivered to
  # every node with its settings, so one is only allowed in the shared profile
  # when its tag is listed on purpose.
  ansible.builtin.assert:
    that:
      - >-
        node_base_preflight_profile_detail.json.response.config.inbounds | default([])
        | rejectattr('protocol', 'in', shared_profile_managed_protocols)
        | rejectattr('tag', 'in', shared_profile_allowed_unmanaged_inbound_tags | default([]))
        | list | length == 0
    fail_msg: >-
      Config Profile '{{ profile_name }}' carries inbound(s)
      {{ node_base_preflight_profile_detail.json.response.config.inbounds | default([])
         | rejectattr('protocol', 'in', shared_profile_managed_protocols)
         | rejectattr('tag', 'in', shared_profile_allowed_unmanaged_inbound_tags | default([]))
         | map(attribute='tag') | list }}
      whose protocol is not one the panel strips per node ({{ shared_profile_managed_protocols | join(', ') }}).
      Every node in the fleet receives such an inbound in full, settings included. If that is intended,
      list the tag in shared_profile_allowed_unmanaged_inbound_tags.
  when:
    - preflight_check_panel | bool
    - node_base_preflight_profile_detail is not skipped | default(false)

- name: Read the panel's Hosts for a conflict check
  ansible.builtin.uri:
    url: "{{ remnawave_panel_url | regex_replace('/+$', '') }}/api/hosts"
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_token }}"
    return_content: true
    status_code: 200
    timeout: "{{ remnawave_api_timeout }}"
    validate_certs: "{{ remnawave_panel_validate_certs }}"
  register: node_base_preflight_hosts
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false
  check_mode: false
  when: preflight_check_panel | bool

- name: Reject ambiguous Hosts in the panel
  ansible.builtin.assert:
    that:
      - >-
        node_base_preflight_hosts.json.response |
        selectattr('remark', 'equalto', item.remark) |
        selectattr('address', 'equalto', item.address) | list | length <= 1
    fail_msg: >-
      The panel already holds more than one Host called '{{ item.remark }}' at {{ item.address }};
      this run would not know which one it owns.
  loop: "{{ host_specs }}"
  loop_control:
    label: "{{ item.remark }}"
  when: preflight_check_panel | bool

- name: Record that the panel was not checked
  ansible.builtin.assert:
    that:
      - preflight_ack_unchecked_panel | bool
    fail_msg: >-
      preflight_check_panel is false, which removes every check that protects the shared Config Profile
      and the panel from a conflicting node. Set preflight_ack_unchecked_panel=true to state that this
      is intentional for this run.
  when: not (preflight_check_panel | bool)

# --- DNS state, reported and never changed here -------------------------------
- name: Resolve the selfsteal name from the controller
  ansible.builtin.command:
    argv: [getent, ahostsv4, "{{ selfsteal_domain }}"]
  register: node_base_preflight_dns
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  check_mode: false
  when: preflight_check_dns | bool

- name: Report the DNS state this run will find
  ansible.builtin.debug:
    msg: >-
      {{ selfsteal_domain }}:
      {{ ('already resolves to ' ~ node_public_ip)
         if node_public_ip in node_base_preflight_dns_addresses
         else ((('resolves to ' ~ (node_base_preflight_dns_addresses | join(', ')))
                if node_base_preflight_dns_addresses | length > 0 else 'does not resolve') ~
               (' - the dns role will point it at ' ~ node_public_ip
                if dns_provider | default('none') != 'none'
                else ' - nothing in this run will fix that')) }}
  vars:
    node_base_preflight_dns_addresses: >-
      {{ node_base_preflight_dns.stdout | default('') | regex_findall('(?m)^([0-9.]+)\s+') | unique }}
  when: preflight_check_dns | bool

- name: Require an unmanaged DNS record to already be correct
  ansible.builtin.assert:
    that:
      - node_public_ip in (node_base_preflight_dns.stdout | default('') | regex_findall('(?m)^([0-9.]+)\s+'))
    fail_msg: >-
      {{ selfsteal_domain }} does not resolve to {{ node_public_ip }} and dns_provider is 'none', so
      nothing in this run will create the record. Create the A record at the registrar (or set
      dns_provider) and run again - the certificate and the masking site both depend on it.
  when:
    - preflight_check_dns | bool
    - dns_provider | default('none') == 'none'
