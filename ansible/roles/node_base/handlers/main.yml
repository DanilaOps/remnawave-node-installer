---
- name: Restart SSH
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

- name: Restart Docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

