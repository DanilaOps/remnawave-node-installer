---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: node-monitoring-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: node-monitoring-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: node-monitoring-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  config_options:
    defaults:
      # The same two paths the project ansible.cfg sets, restated for Molecule:
      # it writes its own ansible.cfg and points ANSIBLE_CONFIG at it, so the
      # one in the repository root is never read from a scenario.
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..
      collections_path: ${MOLECULE_PROJECT_DIRECTORY}/../../collections:~/.ansible/collections:/usr/share/ansible/collections
verifier:
  name: ansible
