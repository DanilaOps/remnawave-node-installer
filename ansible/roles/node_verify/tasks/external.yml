---
- name: Wait for public Reality or TLS port from Controller
  ansible.builtin.wait_for:
    host: "{{ node_public_ip }}"
    port: 443
    state: started
    connect_timeout: 5
    timeout: "{{ verify_external_timeout }}"
  delegate_to: localhost
  become: false

- name: Verify selfsteal response and public certificate with correct SNI
  ansible.builtin.uri:
    url: "https://{{ selfsteal_domain }}/"
    method: GET
    return_content: true
    follow_redirects: safe
    status_code: 200
    timeout: "{{ verify_external_timeout }}"
    validate_certs: true
  register: remnawave_verify_selfsteal
  delegate_to: localhost
  become: false
  changed_when: false

- name: Require a non-empty selfsteal page
  ansible.builtin.assert:
    that:
      - remnawave_verify_selfsteal.content | length > 100
    fail_msg: Public 443 did not return the expected real selfsteal website.

- name: Require the page served publicly to be this node's generated decoy
  ansible.builtin.assert:
    that:
      - remnawave_verify_selfsteal.content is search(remnawave_verify_decoy.brand | regex_escape)
      - remnawave_verify_selfsteal.content is search(remnawave_verify_decoy.assets.css | regex_escape)
      - remnawave_verify_selfsteal.content is search(remnawave_verify_decoy.classes.page | regex_escape)
    fail_msg: >-
      Public 443 served a page that is not this node's generated site. Every node must
      serve its own brand, class names and asset names, otherwise one scan links the
      whole fleet by page hash.
  vars:
    remnawave_verify_decoy: >-
      {{ remnawave_decoy_profiles[selfsteal_virtual_hosts[0].name] }}
  when: verify_require_unique_decoy | bool

- name: Fetch the generated stylesheet the page advertises
  ansible.builtin.uri:
    url: "https://{{ selfsteal_domain }}/{{ remnawave_decoy_profiles[selfsteal_virtual_hosts[0].name].assets.css }}"
    method: GET
    status_code: 200
    timeout: "{{ verify_external_timeout }}"
    return_content: false
  delegate_to: localhost
  become: false
  changed_when: false
  when: verify_require_unique_decoy | bool

- name: Require an independent source for the negative NODE_PORT probe
  ansible.builtin.assert:
    that:
      - verify_node_port_untrusted_probe_host | length > 0
    fail_msg: >-
      Strict firewall acceptance requires verify_node_port_untrusted_probe_host: an inventory host whose source address
      is outside remnawave_panel_cidrs.
  when:
    - node_firewall_enabled | bool
    - verify_require_node_port_denied_probe | bool

- name: Verify NODE_PORT is unavailable from an untrusted source
  ansible.builtin.wait_for:
    host: "{{ node_public_ip }}"
    port: "{{ remnawave_node_port }}"
    state: stopped
    connect_timeout: 3
    timeout: "{{ verify_external_timeout }}"
  delegate_to: "{{ verify_node_port_untrusted_probe_host | default('localhost', true) }}"
  become: false
  when:
    - node_firewall_enabled | bool
    - verify_require_node_port_denied_probe | bool

- name: Prove the node carries traffic with the built-in probe
  ansible.builtin.include_tasks: tunnel_probe.yml
  when:
    - verify_require_tunnel_probe | bool
    - verify_tunnel_probe_command | length == 0

- name: Execute the custom valid-tunnel probe instead
  ansible.builtin.command:
    argv: "{{ verify_tunnel_probe_command }}"
  register: remnawave_verify_tunnel_probe
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: "{{ verify_tunnel_probe_no_log }}"
  when: verify_tunnel_probe_command | length > 0
