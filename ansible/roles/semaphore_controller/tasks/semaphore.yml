---
- name: Read the installed Semaphore version
  ansible.builtin.command:
    argv: ["{{ semaphore_binary_path }}", version]
  register: semaphore_installed_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Download the release checksums when no hash is pinned
  ansible.builtin.get_url:
    url: "{{ semaphore_release_base }}/v{{ semaphore_version }}/semaphore_{{ semaphore_version }}_checksums.txt"
    dest: "{{ semaphore_tmp_path }}/semaphore_{{ semaphore_version }}_checksums.txt"
    owner: root
    group: root
    mode: "0600"
  when:
    - semaphore_sha256 | length == 0
    - semaphore_version not in (semaphore_installed_version.stdout | default(''))

- name: Take the archive's hash from the checksums file
  ansible.builtin.set_fact:
    semaphore_expected_sha256: >-
      {{ lookup('file', semaphore_tmp_path ~ '/semaphore_' ~ semaphore_version ~ '_checksums.txt')
         | regex_search('([0-9a-f]{64})\s+' ~ (semaphore_archive | regex_escape), '\1') | first }}
  when:
    - semaphore_sha256 | length == 0
    - semaphore_version not in (semaphore_installed_version.stdout | default(''))

- name: Download the pinned Semaphore release
  ansible.builtin.get_url:
    url: "{{ semaphore_release_base }}/v{{ semaphore_version }}/{{ semaphore_archive }}"
    dest: "{{ semaphore_tmp_path }}/{{ semaphore_archive }}"
    checksum: "sha256:{{ semaphore_sha256 if semaphore_sha256 | length > 0 else semaphore_expected_sha256 }}"
    owner: root
    group: root
    mode: "0600"
  when: semaphore_version not in (semaphore_installed_version.stdout | default(''))

- name: Unpack the Semaphore binary
  ansible.builtin.unarchive:
    src: "{{ semaphore_tmp_path }}/{{ semaphore_archive }}"
    dest: /usr/local/bin
    remote_src: true
    include: [semaphore]
    owner: root
    group: root
    mode: "0755"
  when: semaphore_version not in (semaphore_installed_version.stdout | default(''))
  notify: Restart Semaphore

- name: Confirm the pinned version is what is installed
  ansible.builtin.command:
    argv: ["{{ semaphore_binary_path }}", version]
  register: semaphore_final_version
  changed_when: false
  check_mode: false

- name: Require the installed binary to be the pinned version
  ansible.builtin.assert:
    that:
      - semaphore_version in semaphore_final_version.stdout
    fail_msg: >-
      {{ semaphore_binary_path }} reports '{{ semaphore_final_version.stdout | trim }}' but
      semaphore_version is {{ semaphore_version }}. The controller has to be rebuildable, so the
      running binary and the pinned version may not drift.

- name: Generate encryption keys for a first installation
  # These three keys encrypt the Key Store. Regenerating them on an existing
  # instance makes every stored SSH key and secret undecryptable, so they are
  # generated exactly once and read back from the configuration afterwards.
  ansible.builtin.command:
    argv: [openssl, rand, -base64, "32"]
  register: semaphore_generated_keys
  loop: [cookie_hash, cookie_encryption, access_key_encryption]
  loop_control:
    label: "{{ item }}"
  changed_when: true
  no_log: true
  when: semaphore_existing_config[item] | default('') | length == 0

- name: Assemble the Semaphore configuration
  ansible.builtin.set_fact:
    semaphore_effective_keys: >-
      {{ dict(['cookie_hash', 'cookie_encryption', 'access_key_encryption'] |
              zip(['cookie_hash', 'cookie_encryption', 'access_key_encryption'] |
                  map('extract', semaphore_existing_config) | list)) |
         combine(dict((semaphore_generated_keys.results | default([]) | rejectattr('skipped', 'defined') |
                       map(attribute='item') | list) |
                      zip(semaphore_generated_keys.results | default([]) |
                          rejectattr('skipped', 'defined') | map(attribute='stdout') | map('trim') | list))) }}
  no_log: true

- name: Write the Semaphore configuration
  ansible.builtin.template:
    src: semaphore-config.json.j2
    dest: "{{ semaphore_config_path }}"
    owner: root
    group: "{{ semaphore_group }}"
    mode: "0640"
  no_log: true
  diff: false
  notify: Restart Semaphore

- name: Install the Semaphore unit
  ansible.builtin.template:
    src: semaphore.service.j2
    dest: /etc/systemd/system/semaphore.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Semaphore

- name: Enable and start Semaphore
  ansible.builtin.systemd_service:
    name: semaphore.service
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for the UI to answer on loopback
  ansible.builtin.wait_for:
    host: "{{ semaphore_interface }}"
    port: "{{ semaphore_port }}"
    state: started
    connect_timeout: 2
    timeout: 60

- name: Confirm nothing outside this host can reach the UI
  ansible.builtin.command:
    argv: [ss, -H, -lnt]
  register: semaphore_listeners
  changed_when: false
  check_mode: false

- name: Require the UI listener to be loopback only
  ansible.builtin.assert:
    that:
      - semaphore_listeners.stdout is not regex('(?m)(^|\s)(0\.0\.0\.0|\[::\]|\*):' ~ semaphore_port ~ '\s')
    fail_msg: >-
      Something is listening on {{ semaphore_port }} on all interfaces. The UI has no TLS and no
      authenticating proxy in front of it; it must be reachable only through an SSH tunnel.
