---
- name: Validate controller inputs
  ansible.builtin.import_tasks: preflight.yml
  tags: [always, preflight]

- name: Configure the controller host
  ansible.builtin.import_tasks: system.yml
  tags: [system]

- name: Install the pinned Ansible runtime
  ansible.builtin.import_tasks: runtime.yml
  tags: [runtime]

- name: Install and configure Semaphore
  ansible.builtin.import_tasks: semaphore.yml
  tags: [semaphore]

- name: Install the controller firewall
  ansible.builtin.import_tasks: firewall.yml
  when: controller_firewall_enabled | bool
  tags: [firewall]

- name: Install the backup job
  ansible.builtin.import_tasks: backup.yml
  when: controller_backup_enabled | bool
  tags: [backup]
