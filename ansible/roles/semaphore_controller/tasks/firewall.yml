---
- name: Detect the source address of the active session
  ansible.builtin.set_fact:
    controller_observed_ssh_source: >-
      {{ ansible_env.SSH_CONNECTION.split()[0] if ansible_env.SSH_CONNECTION is defined else '' }}

- name: Resolve which sources may reach the controller's SSH
  # The live session is always included, so this role cannot be the reason an
  # operator loses access to the machine they are running it from.
  ansible.builtin.set_fact:
    controller_ssh_effective_cidrs: >-
      {{ ((controller_ssh_allowed_cidrs | default([]))
          + ([controller_observed_ssh_source ~
              ('/128' if ':' in controller_observed_ssh_source else '/32')]
             if controller_observed_ssh_source | length > 0 else [])) | unique }}

- name: Require at least one source for SSH
  ansible.builtin.assert:
    that:
      - controller_ssh_effective_cidrs | length > 0
    fail_msg: >-
      No source address could be determined for the controller's SSH. Set
      controller_ssh_allowed_cidrs explicitly, or set controller_firewall_enabled=false - a firewall
      with no way in is not something this role will apply.

- name: Validate the controller allow list
  ansible.builtin.assert:
    that:
      - (item | ansible.utils.ipaddr) != false
    fail_msg: "Invalid controller CIDR: {{ item }}"
  loop: "{{ controller_ssh_effective_cidrs }}"
  loop_control:
    label: "{{ item }}"

- name: Create the nftables configuration directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the controller ruleset
  ansible.builtin.template:
    src: remnawave-controller.nft.j2
    dest: "{{ controller_firewall_config_path }}"
    owner: root
    group: root
    mode: "0600"
  register: controller_firewall_template

- name: Validate the controller ruleset
  ansible.builtin.command:
    argv: [nft, -c, -f, "{{ controller_firewall_config_path }}"]
  changed_when: false

- name: Install the controller firewall units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: remnawave-controller-firewall.service.j2
      dest: /etc/systemd/system/remnawave-controller-firewall.service
    - src: remnawave-controller-firewall-rollback.service.j2
      dest: /etc/systemd/system/remnawave-controller-firewall-rollback.service
    - src: remnawave-controller-firewall-rollback.timer.j2
      dest: /etc/systemd/system/remnawave-controller-firewall-rollback.timer
  notify: Reload systemd

- name: Say what a dry-run would do to the live firewall
  # The block below is the one place in this role that can lock the operator out,
  # so a dry-run must not perform any part of it. It is described instead, in the
  # order it would happen.
  ansible.builtin.debug:
    msg: >-
      Would reload systemd, arm remnawave-controller-firewall-rollback.timer
      ({{ controller_firewall_rollback_seconds }}s), drop the inet
      {{ controller_firewall_table }} table, load {{ controller_firewall_config_path }},
      reconnect to prove management access survived, and then disarm the timer. The rollback units
      {{ 'do not exist on this host yet and would be installed first'
         if 'remnawave-controller-firewall-rollback.timer' not in controller_systemd_units
         else 'are already installed' }}.
  when:
    - ansible_check_mode
    - controller_firewall_template.changed

- name: Apply the changed ruleset with an armed rollback
  when: controller_firewall_template.changed
  block:
    - name: Save the current managed table for rollback
      ansible.builtin.command:
        argv: [nft, list, table, inet, "{{ controller_firewall_table }}"]
      register: controller_previous_ruleset
      changed_when: false
      failed_when: controller_previous_ruleset.rc not in [0, 1]
      # Read-only: it runs in check mode too, so the rollback copy below shows the
      # ruleset that would really be saved rather than an empty file.
      check_mode: false

    - name: Write the rollback ruleset
      ansible.builtin.copy:
        content: "{{ controller_previous_ruleset.stdout | default('') }}\n"
        dest: /run/remnawave-controller-nft-backup.nft
        owner: root
        group: root
        mode: "0600"

    - name: Reload systemd before arming the rollback
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: not ansible_check_mode

    - name: Arm the rollback timer
      ansible.builtin.systemd_service:
        name: remnawave-controller-firewall-rollback.timer
        state: started
      # Arming a timer is a change to the live machine, and in a dry-run the unit
      # file above was not written, so systemd would be asked for a unit that does
      # not exist. What would happen is reported before the block instead.
      when: not ansible_check_mode

    - name: Remove the previous managed table
      ansible.builtin.command:
        argv: [nft, delete, table, inet, "{{ controller_firewall_table }}"]
      register: controller_delete_table
      changed_when: controller_delete_table.rc == 0
      failed_when: controller_delete_table.rc not in [0, 1]

    - name: Load the new managed table
      ansible.builtin.command:
        argv: [nft, -f, "{{ controller_firewall_config_path }}"]
      changed_when: true

    - name: Close the session that predates the firewall change
      # meta: reset_connection takes no conditional. Dropping the connection is
      # harmless in a dry-run - the tasks that would need the new one are the
      # ones guarded above.
      ansible.builtin.meta: reset_connection

    - name: Prove a fresh authenticated connection still works
      ansible.builtin.wait_for_connection:
        connect_timeout: 10
        sleep: 2
        timeout: 45

    - name: Disarm the rollback timer
      ansible.builtin.systemd_service:
        name: remnawave-controller-firewall-rollback.timer
        state: stopped
        enabled: false
      when: not ansible_check_mode

  rescue:
    - name: Wait for the armed rollback to restore access
      ansible.builtin.pause:
        seconds: "{{ controller_firewall_rollback_seconds | int + 10 }}"
      delegate_to: localhost
      become: false

    - name: Reset the failed connection after the rollback
      ansible.builtin.meta: reset_connection

    - name: Prove management access came back
      ansible.builtin.wait_for_connection:
        connect_timeout: 10
        sleep: 2
        timeout: 60

    - name: Stop after the firewall rollback
      ansible.builtin.fail:
        msg: >-
          The controller firewall blocked management access or failed to load; the previous ruleset
          was restored.

- name: Enable the persistent controller firewall
  ansible.builtin.systemd_service:
    name: remnawave-controller-firewall.service
    enabled: true
  # The unit is installed by this run, so in a dry-run on a host that does not
  # have it yet systemd knows nothing about it. Where it exists, whether it is
  # enabled is still checked for real.
  when: >-
    not ansible_check_mode or
    'remnawave-controller-firewall.service' in controller_systemd_units

- name: Report the firewall unit a dry-run would enable
  ansible.builtin.debug:
    msg: >-
      Would install and enable remnawave-controller-firewall.service so the ruleset survives a
      reboot - systemd does not know that unit yet.
  when:
    - ansible_check_mode
    - "'remnawave-controller-firewall.service' not in controller_systemd_units"
