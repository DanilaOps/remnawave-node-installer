---
- name: List existing Hosts
  ansible.builtin.uri:
    url: "{{ remnawave_api_base }}/hosts"
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_token }}"
    return_content: true
    status_code: 200
    timeout: "{{ remnawave_api_timeout }}"
    validate_certs: "{{ remnawave_panel_validate_certs }}"
  register: remnawave_hosts_response
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false
  # Read-only: it runs in check mode too, so a dry-run sees real state.
  check_mode: false

- name: Initialize Host reconciliation state
  ansible.builtin.set_fact:
    remnawave_host_uuids: []
    remnawave_panel_hosts_changed: false

- name: Report the Hosts a dry-run cannot reconcile yet
  ansible.builtin.debug:
    msg: >-
      Dry-run: Host(s)
      {{ host_specs | selectattr('inbound_tag', 'defined')
         | selectattr('inbound_tag', 'in', remnawave_missing_inbound_tags)
         | map(attribute='remark') | join(', ') }}
      point at inbound(s) {{ remnawave_missing_inbound_tags | join(', ') }}, which the Config Profile
      does not carry yet, so the Panel has assigned them no UUID to compare against. A real run writes
      the inbound first and then reconciles the Host.
  when:
    - ansible_check_mode
    - remnawave_missing_inbound_tags | length > 0

- name: Reconcile each declared Host
  ansible.builtin.include_tasks: host_item.yml
  loop: "{{ host_specs }}"
  loop_control:
    loop_var: remnawave_host_spec
    label: "{{ remnawave_host_spec.remark }}"
  # Only ever false in a dry-run: on a real run every managed inbound exists by
  # now, which the assert in profile.yml has already enforced.
  when: remnawave_host_spec.inbound_tag | default('') not in remnawave_missing_inbound_tags

- name: Re-read Hosts after reconciliation
  ansible.builtin.uri:
    url: "{{ remnawave_api_base }}/hosts"
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_token }}"
    return_content: true
    status_code: 200
    timeout: "{{ remnawave_api_timeout }}"
    validate_certs: "{{ remnawave_panel_validate_certs }}"
  register: remnawave_hosts_final
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false
  # Read-only: it runs in check mode too, so a dry-run sees real state.
  check_mode: false

- name: Require one reconciled UUID for every declared Host
  ansible.builtin.assert:
    that:
      - remnawave_host_uuids | length == host_specs | length
    fail_msg: >-
      The Panel returned a UUID for only {{ remnawave_host_uuids | length }} of
      {{ host_specs | length }} declared Hosts, so at least one Host was neither found nor created.
  # A dry-run legitimately has fewer: a Host it did not create has no UUID yet.
  when: not ansible_check_mode

- name: Guarantee every managed Host is published against the expected Xray profile
  ansible.builtin.assert:
    that:
      - >-
        remnawave_hosts_final.json.response |
        selectattr('uuid', 'equalto', item) |
        selectattr('inbound.configProfileUuid', 'equalto', remnawave_config_profile_uuid) |
        list | length == 1
    fail_msg: >-
      Host {{ item }} is not bound to Config Profile '{{ profile_name }}'
      ({{ remnawave_config_profile_uuid }}); clients would receive a configuration without
      this deployment's routing.
  loop: "{{ remnawave_host_uuids if remnawave_hosts_final is not skipped else [] }}"

- name: Determine whether clients need a subscription refresh
  ansible.builtin.set_fact:
    subscription_refresh_required: >-
      {{ remnawave_panel_profile_changed | bool or remnawave_panel_hosts_changed | bool }}

