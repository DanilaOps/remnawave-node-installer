---
- name: Normalize Panel URL
  ansible.builtin.set_fact:
    remnawave_api_base: "{{ remnawave_panel_url | regex_replace('/+$', '') }}/api"

- name: Validate Panel API token
  ansible.builtin.uri:
    url: "{{ remnawave_api_base }}/nodes"
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_token }}"
    return_content: true
    status_code: 200
    timeout: "{{ remnawave_api_timeout }}"
    validate_certs: "{{ remnawave_panel_validate_certs }}"
  register: remnawave_auth_check
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false
  # Read-only: it runs in check mode too, so a dry-run sees real state.
  check_mode: false
  retries: "{{ remnawave_api_retries }}"
  delay: "{{ remnawave_api_delay }}"
  until: remnawave_auth_check.status == 200

- name: Inspect the existing RemnaNode environment
  ansible.builtin.stat:
    path: "{{ remnawave_node_env_path }}"
  register: remnawave_existing_env
  when:
    - remnawave_secret_key_override | length == 0
    - not (remnawave_rotate_node_secret_key | bool)

- name: Read the existing RemnaNode environment
  ansible.builtin.slurp:
    src: "{{ remnawave_node_env_path }}"
  register: remnawave_existing_env_content
  when:
    - remnawave_existing_env.stat.exists | default(false)
    - not (remnawave_rotate_node_secret_key | bool)
  no_log: true

- name: Extract the existing RemnaNode SECRET_KEY
  ansible.builtin.set_fact:
    remnawave_existing_secret_keys: >-
      {{ (remnawave_existing_env_content.content | b64decode) |
         regex_findall('(?m)^SECRET_KEY=([^\r\n]+)\r?$') }}
  when:
    - remnawave_existing_env_content is not skipped
    - remnawave_existing_env_content.content is defined
  no_log: true

- name: Refuse to replace an unreadable existing node identity
  ansible.builtin.assert:
    that:
      - remnawave_existing_secret_keys | default([]) | length == 1
      - remnawave_existing_secret_keys[0] | length > 0
    fail_msg: >-
      The existing {{ remnawave_node_env_path }} has no single non-empty SECRET_KEY.
      Fix the managed file or explicitly request rotation with remnawave_rotate_node_secret_key=true.
  when: remnawave_existing_env.stat.exists | default(false)
  no_log: true

- name: Request RemnaNode SECRET_KEY
  ansible.builtin.uri:
    url: "{{ remnawave_api_base }}/keygen"
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_token }}"
    return_content: true
    status_code: 200
    timeout: "{{ remnawave_api_timeout }}"
    validate_certs: "{{ remnawave_panel_validate_certs }}"
  register: remnawave_keygen_response
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false
  # A GET that mints nothing on the Panel, so a dry-run may ask for it and prove
  # the token really carries the Keygen scope instead of failing on an empty key.
  check_mode: false
  when:
    - remnawave_secret_key_override | length == 0
    - (remnawave_rotate_node_secret_key | bool) or (remnawave_existing_secret_keys | default([]) | length == 0)

- name: Store RemnaNode SECRET_KEY in memory
  ansible.builtin.set_fact:
    remnawave_node_secret_key: >-
      {{ remnawave_secret_key_override
         if remnawave_secret_key_override | length > 0
         else remnawave_existing_secret_keys[0]
         if not (remnawave_rotate_node_secret_key | bool) and
            remnawave_existing_secret_keys | default([]) | length == 1
         else remnawave_keygen_response.json.response.secretKey |
              default(remnawave_keygen_response.json.response.pubKey | default('')) }}
  no_log: true

- name: Record the RemnaNode identity source
  ansible.builtin.set_fact:
    remnawave_node_secret_key_source: >-
      {{ 'override' if remnawave_secret_key_override | length > 0
         else 'existing_env' if not (remnawave_rotate_node_secret_key | bool) and
              remnawave_existing_secret_keys | default([]) | length == 1
         else 'panel_keygen' }}

- name: Require a non-empty RemnaNode SECRET_KEY
  ansible.builtin.assert:
    that:
      - remnawave_node_secret_key | length > 0
    fail_msg: Panel keygen returned no secretKey; grant Keygen scope or provide remnawave_secret_key_override securely.
  no_log: true

- name: Create the protected RemnaNode identity directory
  ansible.builtin.file:
    path: "{{ remnawave_node_env_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Persist RemnaNode identity before further Panel mutations
  ansible.builtin.copy:
    content: |
      NODE_PORT={{ remnawave_node_port }}
      SECRET_KEY={{ remnawave_node_secret_key }}
    dest: "{{ remnawave_node_env_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
