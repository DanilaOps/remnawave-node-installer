---
argument_specs:
  main:
    short_description: Reconcile Remnawave Panel resources for one managed node
    options:
      remnawave_panel_url:
        type: str
        required: true
      remnawave_panel_token:
        type: str
        required: true
      node_name:
        type: str
        required: true
      node_public_ip:
        type: str
        required: true
      node_country:
        type: str
        required: true
      profile_name:
        type: str
        required: true
      inbound_specs:
        type: list
        elements: dict
        required: true
      host_specs:
        type: list
        elements: dict
        required: true
      bridge_spec:
        type: dict
      reality_rotate_keys:
        type: bool
      remnawave_adopt_existing_profile:
        type: bool
      remnawave_node_env_path:
        type: path
      remnawave_rotate_node_secret_key:
        type: bool
