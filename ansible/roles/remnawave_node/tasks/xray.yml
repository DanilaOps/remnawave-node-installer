---
- name: Create pinned Xray installation directory
  ansible.builtin.file:
    path: "{{ xray_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check installed pinned Xray binary
  ansible.builtin.stat:
    path: "{{ xray_binary_path }}"
  register: remnawave_xray_binary

- name: Download pinned Xray archive with its official checksum
  ansible.builtin.get_url:
    url: >-
      https://github.com/{{ xray_release_repository }}/releases/download/v{{ xray_version }}/{{ xray_assets[ansible_facts.architecture] }}
    dest: "/var/cache/{{ xray_assets[ansible_facts.architecture] }}"
    checksum: "sha256:{{ xray_checksums[ansible_facts.architecture] }}"
    owner: root
    group: root
    mode: "0644"
    timeout: 300
  register: remnawave_xray_archive

- name: Extract pinned Xray release
  ansible.builtin.unarchive:
    src: "/var/cache/{{ xray_assets[ansible_facts.architecture] }}"
    dest: "{{ xray_install_dir }}"
    remote_src: true
    owner: root
    group: root
  when: remnawave_xray_archive.changed or not remnawave_xray_binary.stat.exists

- name: Enforce pinned Xray binary permissions
  ansible.builtin.file:
    path: "{{ xray_binary_path }}"
    owner: root
    group: root
    mode: "0755"
  # A dry-run only simulates the download and the extraction above, so on a host
  # without Xray the binary this task would fix does not exist yet.
  when: not (ansible_check_mode and not remnawave_xray_binary.stat.exists)

- name: Read pinned Xray version
  ansible.builtin.command:
    argv: ["{{ xray_binary_path }}", version]
  register: remnawave_xray_version_output
  changed_when: false
  # Read-only: it runs in check mode too, so a dry-run verifies the version of an
  # Xray that is already installed. A real run must still succeed.
  check_mode: false
  failed_when:
    - remnawave_xray_version_output.rc != 0
    - not ansible_check_mode

- name: Report that a dry-run cannot verify an Xray that is not installed yet
  ansible.builtin.debug:
    msg: >-
      Dry-run: {{ xray_binary_path }} is not installed, so the pinned version
      {{ xray_version }} cannot be verified. A real run downloads it by checksum first.
  when: remnawave_xray_version_output.rc | default(1) != 0

- name: Verify exact pinned Xray version
  ansible.builtin.assert:
    that:
      - remnawave_xray_version_output.stdout is match('^Xray ' ~ xray_version ~ ' ')
    fail_msg: "Installed Xray does not match pinned version {{ xray_version }}."
  when: remnawave_xray_version_output.rc | default(1) == 0

- name: Create state directory
  ansible.builtin.file:
    path: "{{ remnawave_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Store desired Xray profile for validation and audit
  ansible.builtin.copy:
    content: "{{ remnawave_desired_xray_config | to_nice_json }}\n"
    dest: "{{ remnawave_state_dir }}/desired-xray.json"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Validate desired profile with the exact pinned Xray core
  ansible.builtin.command:
    argv:
      - "{{ xray_binary_path }}"
      - run
      - -test
      - -c
      - "{{ remnawave_state_dir }}/desired-xray.json"
  environment:
    XRAY_LOCATION_ASSET: "{{ xray_install_dir }}"
  register: remnawave_pinned_xray_validation
  changed_when: false
  no_log: true

