---
# One ACME issuance. Called once per environment in remnawave_certificate_phases,
# so an "auto" first install runs staging and then production without a second
# playbook run.
- name: Inspect the nginx container before choosing an ACME authenticator
  community.docker.docker_container_info:
    name: "{{ remnawave_nginx_container }}"
  register: remnawave_nginx_before_acme
  when: certificate_mode == 'http01'

- name: Check whether a certificate lineage already exists for this phase
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ certificate_name }}/fullchain.pem"
  register: remnawave_certificate_before_phase

- name: Choose the ACME authenticator
  ansible.builtin.set_fact:
    # A running nginx already answers /.well-known/acme-challenge/ from the shared
    # webroot, so HTTP-01 is served without touching it. Standalone is used only
    # when nginx is not running yet, which is the very first installation - there
    # is nothing to interrupt in that case either.
    remnawave_certificate_authenticator: >-
      {{ 'webroot'
         if (remnawave_nginx_before_acme.container.State.Running | default(false))
         else 'standalone' }}
  when: certificate_mode == 'http01'

- name: Build the Certbot command for ACME environment {{ remnawave_certificate_phase }}
  ansible.builtin.set_fact:
    remnawave_certbot_argv: >-
      {{ ['certbot', 'certonly', '--non-interactive', '--agree-tos',
          '--server', certificate_acme_directories[remnawave_certificate_phase],
          '--email', acme_email, '--cert-name', certificate_name]
         + (['--webroot', '--webroot-path', certificate_webroot_path]
            if certificate_mode == 'http01' and remnawave_certificate_authenticator == 'webroot' else
            ['--standalone', '--preferred-challenges', 'http']
            if certificate_mode == 'http01' else
            ['--dns-cloudflare', '--dns-cloudflare-credentials', cloudflare_credentials_path,
             '--dns-cloudflare-propagation-seconds', certificate_dns_propagation_seconds | string])
         + (['--force-renewal']
            if remnawave_certificate_before_phase.stat.exists else ['--keep-until-expiring'])
         + (['-d'] | product(remnawave_certificate_domains) | map('join', '=') | list) }}

- name: Issue the certificate, without stopping nginx, for {{ remnawave_certificate_phase }}
  ansible.builtin.command:
    argv: "{{ remnawave_certbot_argv }}"
  register: remnawave_certbot_result
  changed_when: "'Certificate not yet due for renewal' not in remnawave_certbot_result.stdout"
  no_log: "{{ certificate_mode == 'cloudflare_dns' }}"
  notify: Reload selfsteal nginx

- name: Inspect the certificate this phase installed
  community.crypto.x509_certificate_info:
    path: "/etc/letsencrypt/live/{{ certificate_name }}/fullchain.pem"
  register: remnawave_certificate_phase_info
  # In a dry-run certbot did not run, so a node that has no certificate for this
  # name has no file to inspect. Where one exists the inspection still happens
  # and its result is reported below.
  when: remnawave_certificate_before_phase.stat.exists or not ansible_check_mode

- name: Report what a dry-run can say about the certificate for this phase
  ansible.builtin.debug:
    msg: >-
      Dry-run:
      {{ ('no certificate exists for ' ~ certificate_name ~ ' yet, so the '
          ~ remnawave_certificate_phase ~ ' phase cannot be verified')
         if remnawave_certificate_phase_info is skipped else
         ('the installed certificate is issued by "'
          ~ remnawave_certificate_phase_info.issuer.commonName | default('unknown')
          ~ '", which ' ~ ('matches' if ((remnawave_certificate_phase_info.issuer.organizationName
              | default('') ~ ' ' ~ remnawave_certificate_phase_info.issuer.commonName | default(''))
              is search('(?i)staging')) == (remnawave_certificate_phase == 'staging')
             else 'does NOT match') ~ ' the ' ~ remnawave_certificate_phase ~ ' phase') }}.
      A real run issues the certificate and then requires the issuer to match the requested ACME
      environment before going on to the next phase.
  when: ansible_check_mode

- name: Require the installed certificate to match phase {{ remnawave_certificate_phase }}
  ansible.builtin.assert:
    that:
      - >-
        ((remnawave_certificate_phase_info.issuer.organizationName | default('') ~ ' ' ~
          remnawave_certificate_phase_info.issuer.commonName | default('')) is search('(?i)staging'))
        == (remnawave_certificate_phase == 'staging')
      - remnawave_certificate_phase_info.subject_alt_name | default([]) | length > 0
    fail_msg: >-
      The {{ remnawave_certificate_phase }} phase left a certificate issued by
      '{{ remnawave_certificate_phase_info.issuer.commonName | default('unknown') }}'. Stopping here rather
      than continuing to the next phase with an unexpected certificate installed.
  # A dry-run would judge a certificate certbot was not allowed to issue or
  # renew; what it found is reported above instead of failing the run.
  when: not ansible_check_mode
