---
extends: default
ignore: |
  ansible/.cache/
  ansible/.venv/
  ansible/collections/
rules:
  braces:
    max-spaces-inside: 1
  comments-indentation: false
  line-length:
    max: 140
    level: warning
  truthy:
    allowed-values: ["true", "false"]
  comments:
    min-spaces-from-content: 1
  empty-lines:
    max: 2
    max-start: 0
    max-end: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
