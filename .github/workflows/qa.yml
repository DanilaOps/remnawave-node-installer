---
name: QA

on:
  push:
  pull_request:

permissions:
  contents: read

# Every command runs from the repository root against the single ansible.cfg,
# exactly the way the wrappers and Semaphore run them.
jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate node installer
        run: bash check.sh ./remnawave-node.sh

      - name: Validate mirror installer
        run: bash check-mirror.sh ./install-mirror.sh

      - name: Validate the entry-point wrappers and test scripts
        run: shellcheck -S warning provision-node setup-controller ansible/tests/*.sh

      - name: Reject CRLF and trailing whitespace in tracked text files
        # Guards the files this project writes. LICENSE came from upstream with
        # CRLF and nobody will ever edit it, so it is excluded by name rather
        # than rewritten: a gate that fails on a file that is never touched is a
        # gate people learn to ignore.
        run: |
          bad=0
          while IFS= read -r file; do
            case "$file" in
              *.png|*.jpg|*.ico|*.zip) continue ;;
              LICENSE) continue ;;
            esac
            if grep -qlU $'\r' "$file" 2>/dev/null; then
              echo "CRLF in $file"; bad=1
            fi
            if grep -qE ' +$' "$file" 2>/dev/null; then
              echo "trailing whitespace in $file"; bad=1
            fi
          done < <(git ls-files)
          exit "$bad"

  # Fast lane: everything that needs no container and no network. Runs on every
  # push so a mistake is visible within a minute.
  fast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ansible/requirements.txt
          ansible-galaxy collection install -r ansible/collections/requirements.yml \
            -p ansible/collections

      - name: Validate YAML
        run: yamllint -c .yamllint.yml ansible .github

      - name: Validate role structure and filters
        run: |
          python ansible/tests/validate_structure.py
          python -m unittest discover -s ansible/tests -p 'test_*.py'

      - name: Run Ansible syntax check
        run: |
          for playbook in provision_node install_node bootstrap show_node_identity controller; do
            ansible-playbook "ansible/playbooks/${playbook}.yml" --syntax-check
          done

      - name: Verify an external inventory still resolves the whole node
        run: bash ansible/tests/test_external_inventory.sh

      - name: Verify how node names are allocated
        run: bash ansible/tests/test_node_naming.sh

      - name: Verify how the management allow list is resolved
        run: ansible-playbook -i localhost, -c local ansible/tests/management_cidrs.yml

      - name: Verify the controller firewall dry-run never touches a unit it did not install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables
          bash ansible/tests/test_check_mode_controller.sh

      - name: Verify the guards on deployment values and node identity
        run: |
          ansible-playbook -i ansible/inventories/staging/hosts.yml -c local \
            ansible/tests/preflight_guards.yml --limit ee01

      - name: Render core templates and validate the firewall
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables
          ansible-playbook -i localhost, -c local ansible/tests/render_templates.yml
          sudo nft -c -f /tmp/remnawave-filter-test.nft
          sudo nft -c -f /tmp/remnawave-controller-test.nft

      - name: Run Ansible lint
        run: ansible-lint

  # Full lane: containers, stateful mocks and Molecule. Required for a pull
  # request, skipped on intermediate pushes so the fast lane stays readable.
  full:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ansible/requirements.txt
          ansible-galaxy collection install -r ansible/collections/requirements.yml \
            -p ansible/collections

      - name: Verify Panel API idempotency and concurrency guards against the mock
        run: |
          bash ansible/tests/test_panel_idempotency.sh
          bash ansible/tests/test_panel_bridge_idempotency.sh
          bash ansible/tests/test_panel_errors.sh
          bash ansible/tests/test_panel_entities.sh
          bash ansible/tests/test_shared_profile_concurrency.sh

      - name: Verify --check --diff is honest before, during and after reconciliation
        run: bash ansible/tests/test_check_mode_panel.sh

      - name: Verify the end-to-end probe is fail-closed and works
        run: bash ansible/tests/test_tunnel_probe.sh

      - name: Verify DNS reconciliation against the stateful mock registrar
        run: bash ansible/tests/test_dns_idempotency.sh

      - name: Validate the rendered nginx configuration in the pinned image
        run: bash ansible/tests/validate_nginx.sh

      - name: Test system roles on Debian 12, Debian 13 and Ubuntu 24.04
        run: |
          (cd ansible/roles/node_base && molecule test)
          (cd ansible/roles/remnawave_node && molecule test)
