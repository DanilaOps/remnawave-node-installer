name: QA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate node installer
        run: bash check.sh ./remnawave-node.sh

      - name: Validate mirror installer
        run: bash check-mirror.sh ./install-mirror.sh
