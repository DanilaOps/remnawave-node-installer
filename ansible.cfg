# Semaphore clones the repository and runs playbooks from its root. The CLI
# wrappers cd into ansible/ and use ansible/ansible.cfg; this equivalent root
# config keeps UI runs on the roles and filter plugins from the same checkout.
[defaults]
inventory = ansible/inventories/staging/hosts.yml
roles_path = ansible/roles
filter_plugins = ansible/filter_plugins
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
nocows = True
stdout_callback = default
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=4
