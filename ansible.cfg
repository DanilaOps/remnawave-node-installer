# The one Ansible configuration for this project. Every documented command runs
# from the repository root - the wrappers, the test suite and Semaphore, which
# clones the repository and runs playbooks from its root. Paths are relative to
# this file, so a checkout works wherever it is placed and no command needs
# ANSIBLE_CONFIG or any other environment variable.
[defaults]
inventory = ansible/inventories/staging/hosts.yml
roles_path = ansible/roles
filter_plugins = ansible/filter_plugins
# The checkout first, then the usual paths, so collections installed into the
# repository win without hiding anything the controller already provides.
collections_path = ansible/collections:~/.ansible/collections:/usr/share/ansible/collections
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
nocows = True
stdout_callback = default
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=4
